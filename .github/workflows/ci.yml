name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Scaffold lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify scaffold lock
        shell: bash
        run: bash scaffold/lock.sh verify
      - name: Run bash scaffold smoke
        shell: bash
        run: |
          bash scaffold/smoke/source-credentials.sh
          bash scaffold/smoke/lock-contract.sh
          bash scaffold/smoke/preserve-drift.sh
          bash scaffold/smoke/update-rollback.sh
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failures = 0
          $files = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object {
            $_.FullName -notmatch '[\\/]\.(inspirations|plutonium)[\\/]'
          }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failures++
              Write-Host "Parse failure: $($file.FullName)"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($failures -gt 0) { exit 1 }
          Write-Host "Parsed $($files.Count) PowerShell files."

  scaffold-smoke:
    name: Scaffold smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: pwsh
            script: ./scaffold/smoke/powershell-smoke.ps1 -SkipBuild
          - os: windows-latest
            shell: powershell
            script: ./scaffold/smoke/powershell-smoke.ps1
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run PowerShell scaffold smoke
        shell: ${{ matrix.shell }}
        run: ${{ matrix.script }}

  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: ./build.sh
            shell: bash
          - os: windows-latest
            command: .\build.cmd
            shell: cmd
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify scaffold lock
        if: runner.os == 'Linux'
        shell: bash
        run: bash scaffold/lock.sh verify
      - name: Build and test
        shell: ${{ matrix.shell }}
        run: ${{ matrix.command }}
